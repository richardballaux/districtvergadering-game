<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Stadsspel Aalst – Leo District</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .lion { font-size: 5rem; line-height: 1; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    h1 { font-size: 2rem; font-weight: 800; margin: .75rem 0 .25rem; }
    .subtitle { color: #a8d8ea; font-size: 1rem; margin-bottom: 2.5rem; }
    .btn-start {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 1rem 3rem;
      box-shadow: 0 8px 24px rgba(245,87,108,.4);
      transition: transform .15s, box-shadow .15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(245,87,108,.5); color:#fff; }
    .wait-card {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    .footer { position: fixed; bottom: 1.5rem; color: rgba(255,255,255,.3); font-size:.8rem; }
  </style>
</head>
<body>
  <div class="text-center">
    <div class="lion">🦁</div>
    <h1>Stadsspel Aalst</h1>
    <p class="subtitle">Leo District Districtvergadering · Hopmarkt</p>

    {% if has_participants %}
      <a href="{{ url_for('participant_join') }}" class="btn-start">
        Schrijf je in →
      </a>
    {% else %}
      <div class="wait-card">
        <div class="fs-3 mb-2">⏳</div>
        <p class="mb-1 fw-semibold">Nog even wachten…</p>
        <p class="small mb-3" style="color:rgba(255,255,255,.7)">
          De begeleider is alles nog aan het klaarzetten.<br>Ververs deze pagina over een moment.
        </p>
        <button onclick="location.reload()" class="btn btn-light btn-sm rounded-3">🔄 Vernieuwen</button>
      </div>
    {% endif %}
  </div>

  <div class="footer">Hopmarkt Aalst · Leo District</div>
</body>
</html>
