<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Stadsspel Aalst</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,.4); max-width: 380px; width: 100%; }
    .login-card .card-body { padding: 2.5rem; }
    .logo { font-size: 3rem; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="card-body text-center">
    <div class="logo mb-2">🦁</div>
    <h4 class="fw-bold mb-1">Stadsspel Aalst</h4>
    <p class="text-muted small mb-4">Begeleiderspaneel – Leo District</p>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Wachtwoord</label>
        <input type="password" name="password" class="form-control form-control-lg" placeholder="Voer wachtwoord in" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
        Aanmelden
      </button>
    </form>
    <p class="text-muted small mt-3">Standaard wachtwoord: <code>leos2024</code></p>
  </div>
</div>
</body>
</html>
